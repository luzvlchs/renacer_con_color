{% extends 'base.html' %}

{% block content %}

<div class="login-box">

    <h1> Administrador</h1>

    <p>Acceso exclusivo para administración</p>

    <form action="/validar_admin" method="POST">

        <input
            type="text"
            name="usuario"
            placeholder="Usuario"
            required>

        <input
            type="password"
            name="password"
            placeholder="Contraseña"
            required>

        <button type="submit">
            Ingresar
        </button>

    </form>

    <a href="/" class="volver">
        ← Volver al inicio
    </a>

</div>

{% endblock %}
